<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="キングス">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <title>キングス 試合チャット</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161411;
      --line: #3a3120;
      --gold: #d4af37;
      --gold-soft: #f1d77a;
      --text: #f5f1e6;
      --muted: #a39c8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(120% 60% at 50% 0%, #2a2210 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.5;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }

    /* 上のタブ: 横幅いっぱいの4つのボタン(アイコン+名前)。指で押しやすい高さにする */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 18px; }
    .tabs a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 58px;
      padding: 6px 2px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .tabs a:active { transform: scale(.96); }
    .tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: #111; }

    header { text-align: center; margin-bottom: 20px; }
    /* ホーム(次の試合のページ)に戻るボタン */
    .home {
      display: inline-flex; margin: 0 0 10px; align-items: center; gap: 2px;
      min-height: 40px; padding: 0 12px 0 8px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--card); color: var(--gold-soft); font-size: 13px; font-weight: 800; text-decoration: none;
    }
    .home svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .home:active { transform: scale(.96); }
    .team { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--gold); }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }


    .game { display: grid; gap: 6px; margin-bottom: 14px; }
    .game select {
      width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 15px; font-weight: 700;
    }
    .game small { font-size: 11px; color: var(--muted); text-align: center; }
    .game .now { color: var(--gold-soft); font-weight: 700; }

    .box { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px; }
    .box label { font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
    .row { display: flex; gap: 8px; }
    .box input[type=text] {
      flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #0f0e0b; color: var(--text); font: inherit; font-size: 16px;
    }
    .btn {
      flex: none; min-height: 46px; padding: 0 16px; border: 0; border-radius: 10px;
      background: var(--gold); color: #111; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .me { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .me b { color: var(--gold-soft); }
    .link { border: 0; background: none; color: var(--gold); font: inherit; font-size: 13px; cursor: pointer; padding: 6px 0; }
    .hint { margin: 8px 0 0; font-size: 11px; color: var(--muted); line-height: 1.6; }
    .status { margin: 6px 0 0; font-size: 12px; color: var(--gold-soft); min-height: 1.2em; }

    .log {
      list-style: none; margin: 0 0 12px; padding: 4px 2px;
      height: 55vh; height: 55dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      overscroll-behavior: contain;
    }
    .log li { max-width: 85%; align-self: flex-start; }
    .log li.mine { align-self: flex-end; text-align: right; }
    .log .who { font-size: 11px; color: var(--muted); margin: 0 4px 2px; }
    .log .who b { color: var(--gold-soft); font-weight: 700; }
    .log .bubble {
      display: inline-block; text-align: left; padding: 8px 12px; border-radius: 16px 16px 16px 4px;
      background: #24201a; font-size: 15px; line-height: 1.5; word-break: break-word; white-space: pre-wrap;
    }
    .log li.mine .bubble { background: var(--gold); color: #111; border-radius: 16px 16px 4px 16px; }
    /* 返信 */
    .log .rbtn { border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; padding: 4px 6px; cursor: pointer; }
    .log .quote {
      display: block; max-width: 100%; margin: 0 0 3px; padding: 4px 10px; border: 0; border-left: 3px solid var(--gold);
      border-radius: 6px; background: rgba(255, 255, 255, .05); color: var(--muted); font: inherit; font-size: 12px;
      text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .log li.mine .quote { margin-left: auto; }
    .log .quote b { color: var(--gold-soft); font-weight: 700; }
    .log li.tome .bubble { box-shadow: 0 0 0 2px var(--gold-soft); }
    .log li.flash .bubble { animation: flash 1.2s ease; }
    @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px #fff; } 100% { box-shadow: none; } }
    .replying {
      display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 6px 10px;
      border-left: 3px solid var(--gold); border-radius: 6px; background: rgba(255, 255, 255, .05);
      font-size: 12px; color: var(--muted);
    }
    .replying[hidden] { display: none; }
    .replying span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .replying b { color: var(--gold-soft); }
    .replying button { flex: none; border: 0; background: none; color: var(--gold); font: inherit; font-size: 18px; line-height: 1; padding: 4px 6px; cursor: pointer; }
    /* 写真 */
    .log .pic { display: block; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #1a1712; cursor: pointer; margin: 0 0 3px; }
    .log li.mine .pic { margin-left: auto; }
    .log .pic img { display: block; max-width: min(220px, 60vw); max-height: 260px; object-fit: cover; }
    .log .gone { display: inline-block; padding: 8px 12px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; margin: 0 0 3px; }
    .attach { position: relative; flex: none; width: 46px; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: #0f0e0b; display: grid; place-items: center; cursor: pointer; }
    .attach svg { width: 22px; height: 22px; fill: none; stroke: var(--gold-soft); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .attach input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .preview { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 12px; color: var(--muted); }
    .preview[hidden] { display: none; }
    .preview img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
    .preview button { border: 0; background: none; color: var(--gold); font: inherit; font-size: 18px; padding: 4px 6px; cursor: pointer; margin-left: auto; }
    .viewer { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, .92); }
    .viewer.open { display: flex; }
    .viewer img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
    .log .empty { align-self: center; max-width: none; color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
    .note { margin-top: 16px; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <nav class="tabs">
      <a href="./"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2.2"/></svg><span>次の試合</span></a>
      <a href="players.html"><svg viewBox="0 0 24 24"><path d="M8 3l-4 3 2 4h2v11h8V10h2l2-4-4-3c-.5 1.7-2 3-4 3s-3.5-1.3-4-3z"/></svg><span>選手一覧</span></a>
      <a href="stats.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>成績</span></a>
      <a href="dancers.html"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>ダンサーズ</span></a>
      <a href="album.html"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>アルバム</span></a>
    </nav>
    <a class="home" href="./"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>ホームに戻る</a>
    <header>
      <p class="team">RYUKYU GOLDEN KINGS</p>
      <h1>GAME CHAT</h1>
    </header>

    <div class="game">
      <select id="gameSel" aria-label="試合を選ぶ"></select>
      <small><span class="now" id="nowCount"></span>試合ごとに別々のチャットです</small>
    </div>

    <ol class="log" id="log"><li class="empty">読み込み中…</li></ol>

    <!-- ニックネームの登録(初回だけ) -->
    <form class="box" id="nickForm" hidden>
      <label>ニックネームを決めてください（必須・20文字まで）
        <div class="row">
          <input type="text" id="nickInput" maxlength="20" placeholder="例：キングス太郎" autocomplete="nickname">
          <button type="submit" class="btn" id="nickSave" disabled>決定</button>
        </div>
      </label>
      <p class="hint">このスマホに覚えておくので、次からは同じニックネームで参加できます。あとから変えることもできます。</p>
    </form>

    <!-- 発言 -->
    <div class="box" id="chatBox" hidden>
      <div class="me"><span><b id="myNick"></b> として参加中</span><button type="button" class="link" id="nickChange">変更</button></div>
      <div class="replying" id="replying" hidden><span id="replyingText"></span><button type="button" id="replyCancel" aria-label="返信をやめる">×</button></div>
      <div class="preview" id="preview" hidden><img id="previewImg" alt=""><span>この写真を送ります（3時間で消えます）</span><button type="button" id="previewCancel" aria-label="写真をやめる">×</button></div>
      <form class="row" id="sayForm">
        <label class="attach" aria-label="写真を選ぶ"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input type="file" id="photoInput" accept="image/*"></label>
        <input type="text" id="sayInput" maxlength="200" placeholder="メッセージを入力" enterkeyhint="send" autocomplete="off">
        <button type="submit" class="btn" id="sayBtn" disabled>送信</button>
      </form>
      <p class="status" id="status"></p>
    </div>

    <p class="note">チャットはこのページを見ているみんなに公開されます。悪口・個人情報・宣伝は書かないでください。<br>ほかの観客など、知らない人の顔がはっきり写った写真は送らないでください。<br>メッセージは約12時間、写真は約3時間で自動的に消えます。</p>
  </main>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true"><img id="viewerImg" alt=""></div>

  <script>
    const NTFY = "https://ntfy.sh";
    const CHAT_PREFIX = "kings-chat-a38853caea-";   // + 試合のキー(ScheduleKey)で、試合ごとのトピックにする
    const NICK_KEY = "kings-nick";                   // ニックネーム(アルバムの投稿でも使う)
    const NICK_MAX = 20, TEXT_MAX = 200;
    const QUOTE_MAX = 40;                            // 返信先として引用する文字数
    const PHOTO_SIDE = 1280;                         // 送る前に写真の長い辺をここまで縮める
    // 「今見ている人」: 開いている間、数分おきに「見てるよ」の合図を別のトピックに送り、最近の合図の数を数える
    const HERE_PREFIX = "kings-chatnow-a38853caea-";
    const HERE_EVERY_MS = 150 * 1000;                // 合図を送る間隔(ntfy の送信回数の上限を使い切らないよう控えめに)
    const HERE_WINDOW_MS = 6 * 60 * 1000;            // この時間内に合図があった人を「見ている」と数える
    const COOLDOWN_MS = 3000;                        // 連投の間隔(いたずら対策)
    const GAME_LENGTH_MS = 2.5 * 60 * 60 * 1000;
    const TZ = "Asia/Tokyo";

    const $ = id => document.getElementById(id);
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    const clean = (s, n) => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, n);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    const cid = (() => {
      let v = store.get("kings-cid");
      if (!v) { v = Math.random().toString(36).slice(2, 12); store.set("kings-cid", v); }
      return v;
    })();
    const fmtGame = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, month: "numeric", day: "numeric", weekday: "short" });
    const fmtClock = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    const keyOf = url => (String(url || "").match(/ScheduleKey=(\d+)/) || [])[1] || "";

    // ---------------------------------------------------------------- ニックネーム
    let nick = clean(store.get(NICK_KEY), NICK_MAX);
    function showNick() {
      $("nickForm").hidden = !!nick;
      $("chatBox").hidden = !nick;
      $("myNick").textContent = nick;
    }
    $("nickInput").addEventListener("input", () => { $("nickSave").disabled = !clean($("nickInput").value, NICK_MAX); });
    $("nickForm").addEventListener("submit", e => {
      e.preventDefault();
      const v = clean($("nickInput").value, NICK_MAX);
      if (!v) return;
      nick = v;
      store.set(NICK_KEY, nick);
      showNick();
      $("sayInput").focus();
    });
    $("nickChange").addEventListener("click", () => {
      $("nickInput").value = nick;
      $("nickSave").disabled = !nick;
      nick = "";
      showNick();
      $("nickInput").focus();
    });
    showNick();

    // ---------------------------------------------------------------- 試合の選択
    let game = null, source = null;
    const seen = new Set();
    // 終わったばかりの試合は、予定(schedule.json)から外れたあと結果(games.json)に入るまで少し間があくので、
    // 速報(kings-live)の最後の内容からも試合を拾う
    const LIVE_TOPIC = "kings-live-a38853caea";
    function fetchLiveGame() {
      return fetch(`${NTFY}/${LIVE_TOPIC}/json?poll=1&since=12h`, { cache: "no-store" })
        .then(r => r.ok ? r.text() : "")
        .then(t => {
          let last = null;
          for (const line of t.split("\n")) {
            try {
              const d = JSON.parse(JSON.parse(line).message);
              if (d && d.type === "kings-live" && d.key && d.datetime && (!last || d.updated > last.updated)) last = d;
            } catch {}
          }
          return last && { key: String(last.key), datetime: last.datetime, opponent: last.opponent || "", kings: last.kings, opp: last.opp, done: last.period === "FINAL" };
        })
        .catch(() => null);
    }
    function chooseGames(schedule, results, liveGame) {
      const map = new Map();
      for (const g of results) if (g.key) map.set(g.key, { ...g, done: true });
      for (const g of schedule) { const k = keyOf(g.url); if (k && !map.has(k)) map.set(k, { ...g, key: k }); }
      if (liveGame && !map.has(liveGame.key)) map.set(liveGame.key, liveGame);
      const list = [...map.values()].filter(g => !isNaN(new Date(g.datetime))).sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
      const now = Date.now();
      // 進行中か次の試合を基準に、前後の試合を選べるようにする
      let i = list.findIndex(g => new Date(g.datetime).getTime() + GAME_LENGTH_MS > now);
      if (i < 0) i = list.length - 1;
      return { list: list.slice(Math.max(0, i - 5), i + 4), current: list[i] };
    }
    function label(g) {
      if (!g.datetime) return "リンクの試合のチャット";
      const res = g.done && Number.isFinite(g.kings) ? `  ${g.kings}-${g.opp} ${g.kings > g.opp ? "WIN" : "LOSE"}` : "";
      return `${fmtGame.format(new Date(g.datetime))} vs ${g.opponent}${res}`;
    }

    // ---------------------------------------------------------------- チャット
    function addMessage(m, scroll) {
      if (!m || m.event !== "message" || !m.id || seen.has(m.id)) return;
      let d;
      try { d = JSON.parse(m.message); } catch { return; }
      if (!d || d.type !== "kings-chat" || d.game !== game.key) return;
      const who = clean(d.nick, NICK_MAX), text = clean(d.text, TEXT_MAX);
      const att = m.attachment && /^https:\/\/ntfy\.sh\/file\//.test(m.attachment.url || "") ? m.attachment : null;
      if (!who || !(text || att)) return;
      const rp = d.reply && typeof d.reply === "object"
        ? { id: clean(d.reply.id, 20), nick: clean(d.reply.nick, NICK_MAX), text: clean(d.reply.text, QUOTE_MAX), cid: clean(d.reply.cid, 20) } : null;
      seen.add(m.id);
      const log = $("log");
      log.querySelector(".empty")?.remove();
      const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      const li = document.createElement("li");
      li.className = [d.cid === cid && "mine", rp && rp.cid === cid && d.cid !== cid && "tome"].filter(Boolean).join(" ");
      li.dataset.t = m.time || 0;
      li.id = "m-" + m.id;
      li.dataset.id = m.id;
      li.dataset.nick = who;
      li.dataset.cid = clean(d.cid, 20);
      li.dataset.text = text || "📷 写真";
      const expired = att && att.expires && att.expires * 1000 < Date.now();
      const picHtml = !att ? "" : expired ? '<div class="gone">📷 写真は期限切れで消えました</div>'
        : `<button type="button" class="pic" data-full="${esc(att.url)}"><img src="${esc(att.url)}" alt="写真" loading="lazy"></button>`;
      li.innerHTML = `<div class="who"><b>${esc(who)}</b> ${m.time ? fmtClock.format(new Date(m.time * 1000)) : ""}${rp && rp.cid === cid && d.cid !== cid ? " ・あなたへの返信" : ""}</div>
        ${rp && rp.nick ? `<button type="button" class="quote" data-to="${esc(rp.id)}">↩︎ <b>${esc(rp.nick)}</b> ${esc(rp.text)}</button>` : ""}
        ${picHtml}${text ? `<div class="bubble">${esc(text)}</div>` : ""}<button type="button" class="rbtn" data-reply="${esc(m.id)}">返信</button>`;
      // 時刻順に差し込む
      const after = [...log.children].reverse().find(x => Number(x.dataset.t) <= (m.time || 0));
      after ? after.after(li) : log.prepend(li);
      if (scroll || nearBottom || d.cid === cid) log.scrollTop = log.scrollHeight;
    }
    // ---------------------------------------------------------------- 今見ている人
    const here = { source: null, seen: new Map(), lastSent: 0, timer: null };
    function countHere() {
      const now = Date.now();
      for (const [k, t] of here.seen) if (now - t > HERE_WINDOW_MS) here.seen.delete(k);
      const n = Math.max(1, here.seen.size + (here.seen.has(cid) ? 0 : 1));   // 自分は必ず数える
      $("nowCount").textContent = `👀 今 ${n}人が見ています・`;
    }
    function acceptHere(m) {
      if (!m || m.event !== "message") return;
      let d;
      try { d = JSON.parse(m.message); } catch { return; }
      if (!d || d.type !== "kings-here" || !game || d.game !== game.key || !d.cid) return;
      const t = (m.time || 0) * 1000;
      if (t > (here.seen.get(d.cid) || 0)) here.seen.set(d.cid, t);
      countHere();
    }
    function sendHere(force) {
      if (!game || document.hidden) return;
      if (!force && Date.now() - here.lastSent < HERE_EVERY_MS) return;
      here.lastSent = Date.now();
      fetch(`${NTFY}/${HERE_PREFIX}${game.key}`, { method: "POST", body: JSON.stringify({ type: "kings-here", v: 1, game: game.key, cid }) }).catch(() => {});
    }
    function openHere(g) {
      if (here.source) here.source.close();
      here.seen = new Map();
      countHere();
      const topic = HERE_PREFIX + g.key;
      here.source = "EventSource" in window ? new EventSource(`${NTFY}/${topic}/sse`) : null;
      if (here.source) here.source.onmessage = e => { try { acceptHere(JSON.parse(e.data)); } catch {} };
      fetch(`${NTFY}/${topic}/json?poll=1&since=${Math.ceil(HERE_WINDOW_MS / 60000)}m`, { cache: "no-store" })
        .then(r => r.ok ? r.text() : "")
        .then(t => t.split("\n").forEach(line => { if (line.trim()) { try { acceptHere(JSON.parse(line)); } catch {} } }))
        .catch(() => {});
      sendHere(true);
      clearInterval(here.timer);
      here.timer = setInterval(() => { sendHere(false); countHere(); }, 30 * 1000);
    }
    // 画面に戻ってきたら、しばらく送っていなければすぐ合図する
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && Date.now() - here.lastSent > 60 * 1000) sendHere(true);
    });

    function openGame(g) {
      game = g;
      seen.clear();
      setReply(null);
      setPhoto(null);
      $("log").innerHTML = '<li class="empty">読み込み中…</li>';
      if (source) source.close();
      const topic = CHAT_PREFIX + g.key;
      history.replaceState(null, "", "?game=" + encodeURIComponent(g.key));
      openHere(g);
      source = "EventSource" in window ? new EventSource(`${NTFY}/${topic}/sse`) : null;
      if (source) source.onmessage = e => { try { addMessage(JSON.parse(e.data)); } catch {} };
      fetch(`${NTFY}/${topic}/json?poll=1&since=all`, { cache: "no-store" })
        .then(r => r.ok ? r.text() : "")
        .then(t => {
          if (game !== g) return;
          t.split("\n").forEach(line => { if (line.trim()) { try { addMessage(JSON.parse(line)); } catch {} } });
          $("log").scrollTop = $("log").scrollHeight;
        })
        .catch(() => {})
        .finally(() => {
          if (game === g && !$("log").querySelector("li:not(.empty)")) {
            $("log").innerHTML = '<li class="empty">まだメッセージはありません。<br>最初のひとことをどうぞ！</li>';
          }
        });
      updateSay();
    }

    // ---------------------------------------------------------------- 返信
    let replyTo = null;   // {id, nick, text, cid}
    function setReply(r) {
      replyTo = r;
      $("replying").hidden = !r;
      if (r) $("replyingText").innerHTML = `↩︎ <b>${esc(r.nick)}</b> に返信：${esc(r.text)}`;
    }
    $("replyCancel").addEventListener("click", () => setReply(null));
    $("log").addEventListener("click", e => {
      const rb = e.target.closest("[data-reply]");
      if (rb) {
        const li = rb.closest("li");
        if (!nick) { $("nickInput").focus(); return; }
        setReply({ id: li.dataset.id, nick: li.dataset.nick, text: li.dataset.text.slice(0, QUOTE_MAX), cid: li.dataset.cid });
        $("sayInput").focus();
        return;
      }
      const pic = e.target.closest("[data-full]");
      if (pic) {
        $("viewerImg").src = pic.dataset.full;
        $("viewer").classList.add("open");
        return;
      }
      const q = e.target.closest("[data-to]");
      if (q) {
        const target = document.getElementById("m-" + q.dataset.to);
        if (!target) return;   // 元のメッセージが消えている
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
      }
    });

    $("viewer").addEventListener("click", () => { $("viewer").classList.remove("open"); $("viewerImg").removeAttribute("src"); });
    // 写真が読み込まれて高さが変わっても、いちばん下を見ていたら下に合わせる
    $("log").addEventListener("load", e => {
      const log = $("log");
      if (e.target.tagName === "IMG" && log.scrollHeight - log.scrollTop - log.clientHeight < 400) log.scrollTop = log.scrollHeight;
    }, true);

    // ---------------------------------------------------------------- 写真
    let photo = null;   // 縮小済みの JPEG(Blob)
    function setPhoto(blob) {
      photo = blob;
      $("preview").hidden = !blob;
      if (blob) $("previewImg").src = URL.createObjectURL(blob);
      updateSay();
    }
    // 向きを直して縮小した JPEG にする(この時点で位置情報などのメタデータは消える)
    async function shrink(file) {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, PHOTO_SIDE / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));
    }
    $("photoInput").addEventListener("change", async () => {
      const file = $("photoInput").files[0];
      $("photoInput").value = "";
      if (!file) return;
      $("status").textContent = "写真を準備しています…";
      try { setPhoto(await shrink(file)); $("status").textContent = ""; }
      catch { $("status").textContent = "この写真は読み込めませんでした"; }
    });
    $("previewCancel").addEventListener("click", () => setPhoto(null));

    let lastSent = 0, sending = false;
    function updateSay() { $("sayBtn").disabled = sending || !game || !(clean($("sayInput").value, TEXT_MAX) || photo); }
    $("sayInput").addEventListener("input", updateSay);
    $("sayForm").addEventListener("submit", async e => {
      e.preventDefault();
      const text = clean($("sayInput").value, TEXT_MAX);
      if (!(text || photo) || !nick || !game || sending) return;
      const wait = lastSent + COOLDOWN_MS - Date.now();
      if (wait > 0) { $("status").textContent = `あと${Math.ceil(wait / 1000)}秒待ってから送ってください`; return; }
      sending = true; updateSay();
      try {
        const msg = JSON.stringify({ type: "kings-chat", v: 1, game: game.key, cid, nick, text, ...(replyTo ? { reply: replyTo } : {}) });
        const topicUrl = `${NTFY}/${CHAT_PREFIX}${game.key}`;
        // 写真は添付ファイルとして送り、メッセージ本文は URL の message に入れる
        const r = photo
          ? await fetch(`${topicUrl}?filename=chat.jpg&message=${encodeURIComponent(msg)}`, { method: "PUT", body: photo })
          : await fetch(topicUrl, { method: "POST", body: msg });
        if (!r.ok) throw new Error(r.status);
        if (photo) setPhoto(null);
        lastSent = Date.now();
        $("sayInput").value = "";
        setReply(null);
        $("status").textContent = "";
      } catch {
        $("status").textContent = "送れませんでした。電波のよいところでもう一度お試しください";
      } finally {
        sending = false; updateSay();
      }
    });

    Promise.all([
      fetch("schedule.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch("games.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetchLiveGame(),
    ]).then(([sj, gj, lg]) => {
      const { list, current } = chooseGames(sj.games || [], gj.games || [], lg);
      // リンクで指定された試合が一覧に見つからなくても、別の試合にすり替えずにその試合のチャットを開く
      const want = (new URLSearchParams(location.search).get("game") || "").replace(/\D/g, "");
      if (want && !list.some(g => g.key === want)) list.push({ key: want, datetime: null, opponent: "" });
      if (!list.length) { $("log").innerHTML = '<li class="empty">試合の予定を読み込めませんでした</li>'; return; }
      const start = list.find(g => g.key === want) || current || list[list.length - 1];
      $("gameSel").innerHTML = list.map(g => `<option value="${esc(g.key)}"${g === start ? " selected" : ""}>${esc(label(g))}</option>`).join("");
      $("gameSel").addEventListener("change", () => openGame(list.find(g => g.key === $("gameSel").value)));
      openGame(start);
    });
  </script>
</body>
</html>
