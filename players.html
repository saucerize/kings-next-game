<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="キングス">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>キングス 選手一覧</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161411;
      --line: #3a3120;
      --gold: #d4af37;
      --gold-soft: #f1d77a;
      --text: #f5f1e6;
      --muted: #a39c8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(120% 60% at 50% 0%, #2a2210 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.5;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }

    .tabs { display: flex; gap: 6px; margin: 0 0 16px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs a {
      flex: none;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
    }
    .tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: #111; }

    header { text-align: center; margin-bottom: 20px; }
    .team { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--gold); }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .filters button {
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .filters button.on { border-color: var(--gold); color: var(--gold-soft); }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .player {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .player > a.main { display: block; flex: 1; color: inherit; text-decoration: none; }
    .sns { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
    .sns a {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px; font-weight: 700;
      color: var(--gold-soft);
      text-decoration: none;
    }
    .sns svg { width: 12px; height: 12px; fill: currentColor; }
    .photo {
      position: relative;
      aspect-ratio: 1;
      background: radial-gradient(90% 70% at 50% 30%, #2a2210 0%, #0f0e0b 70%);
      overflow: hidden;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .num {
      position: absolute; left: 8px; top: 6px;
      font-size: 22px; font-weight: 800; color: var(--gold-soft);
      text-shadow: 0 1px 6px rgba(0,0,0,.8);
      font-variant-numeric: tabular-nums;
    }
    .body { padding: 10px 12px 12px; }
    .name { font-size: 15px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .pos { margin-top: 4px; font-size: 12px; color: var(--gold); }
    .avg { margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .avg b { color: var(--gold-soft); font-size: 15px; margin-right: 2px; }

    .message { text-align: center; color: var(--muted); padding: 40px 0; }
    .note { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
    .note a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <nav class="tabs">
      <a href="./">次の試合</a>
      <a href="players.html" aria-current="page">選手一覧</a>
      <a href="stats.html">成績</a>
      <a href="dancers.html">ダンサーズ</a>
    </nav>
    <header>
      <p class="team">RYUKYU GOLDEN KINGS</p>
      <h1>PLAYERS</h1>
    </header>
    <div class="filters" id="filters"></div>
    <div id="app"><p class="message">読み込み中…</p></div>
    <p class="note" id="note"></p>
  </main>

  <script>
    const app = document.getElementById("app");
    const filters = document.getElementById("filters");
    const POSITIONS = ["PG", "SG", "SF", "PF", "C"];
    let players = [];
    let seasonAvg = new Map();   // 選手名 → {gp, ppg}

    // games.json(終わった試合の成績)から、今シーズンの1試合平均得点を出す
    function buildAverages(games) {
      const by = new Map();
      for (const g of games) {
        for (const p of g.players || []) {
          if (!p.min || /^0?0:00$/.test(p.min)) continue;   // 出場していない試合は数えない
          const s = by.get(p.name) || { gp: 0, pts: 0 };
          s.gp += 1;
          s.pts += p.pts || 0;
          by.set(p.name, s);
        }
      }
      return new Map([...by].map(([n, s]) => [n, { gp: s.gp, ppg: s.pts / s.gp }]));
    }
    let current = "ALL";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // SNS の種類ごとの小さなアイコン(単純な図形)
    const SNS_ICON = {
      X: '<svg viewBox="0 0 24 24"><path d="M3 3h4.6l4.6 6.3L17.6 3H21l-7.2 8.2L21.5 21h-4.6l-5-6.8L5.8 21H2.4l7.7-8.8z"/></svg>',
      Instagram: '<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM17.3 5.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>',
      TikTok: '<svg viewBox="0 0 24 24"><path d="M14 2h3a5 5 0 0 0 4 4v3a8 8 0 0 1-4-1.2V15a6 6 0 1 1-6-6v3a3 3 0 1 0 3 3z"/></svg>',
      YouTube: '<svg viewBox="0 0 24 24"><path d="M22 8.2a3 3 0 0 0-2-2.1C18.2 5.6 12 5.6 12 5.6s-6.2 0-8 .5a3 3 0 0 0-2 2.1A31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2 2.1c1.8.5 8 .5 8 .5s6.2 0 8-.5a3 3 0 0 0 2-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8zM10 15.2V8.8l5.4 3.2z"/></svg>',
    };

    function snsHtml(p) {
      const links = Array.isArray(p.sns) ? p.sns.filter(x => x && /^https:\/\//.test(x.url)) : [];
      if (!links.length) return "";
      return `<div class="sns">${links.map(x =>
        // X はアイコン自体が文字の「X」なので、名前は重ねて書かない
        `<a href="${esc(x.url)}" target="_blank" rel="noopener" aria-label="${esc(x.type)}">${SNS_ICON[x.type] || ""}${x.type === "X" ? "" : esc(x.type)}</a>`).join("")}</div>`;
    }

    function renderFilters() {
      filters.innerHTML = ["ALL", ...POSITIONS].map(p =>
        `<button type="button" data-pos="${p}" class="${p === current ? "on" : ""}">${p === "ALL" ? "すべて" : p}</button>`).join("");
    }

    function render() {
      renderFilters();
      // 「PG/SG」のような複数ポジションの選手は、どちらで絞っても出す
      const list = current === "ALL" ? players : players.filter(p => String(p.position || "").split("/").includes(current));
      if (!list.length) {
        app.innerHTML = '<p class="message">該当する選手はいません。</p>';
        return;
      }
      app.innerHTML = `<div class="grid">${list.map(p => `
        <div class="player">
          <a class="main" href="${esc(p.url)}" target="_blank" rel="noopener">
          <div class="photo">
            ${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
            <span class="num">#${p.number ?? "-"}</span>
          </div>
          <div class="body">
            <div class="name">${esc(p.name)}</div>
            <div class="pos">${esc(p.position || "")}</div>
            ${seasonAvg.has(p.name) ? `<div class="avg"><b>${seasonAvg.get(p.name).ppg.toFixed(1)}</b>点／試合（${seasonAvg.get(p.name).gp}試合）</div>` : ""}
          </div>
          </a>
          ${snsHtml(p)}
        </div>`).join("")}</div>`;
    }

    filters.addEventListener("click", e => {
      const b = e.target.closest("button[data-pos]");
      if (!b) return;
      current = b.dataset.pos;
      render();
    });

    fetch("players.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        players = Array.isArray(data.players) ? data.players : [];
        document.getElementById("note").innerHTML =
          `B.LEAGUE 公式サイトから自動で更新しています${data.updated ? `（最終更新 ${esc(data.updated)}）` : ""}<br>` +
          `選手をタップすると<a href="${esc(data.source || "https://www.bleague.jp/roster/?tab=1&club=701")}" target="_blank" rel="noopener">公式の選手ページ</a>が開きます。SNS は B.LEAGUE 公式の選手ページに載っているアカウントです`;
        render();
      })
      .catch(() => {
        app.innerHTML = '<p class="message">選手一覧を読み込めませんでした。</p>';
      });

    fetch("games.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : { games: [] })
      .then(data => {
        seasonAvg = buildAverages(Array.isArray(data.games) ? data.games : []);
        if (players.length) render();
      })
      .catch(() => {});
  </script>
</body>
</html>
