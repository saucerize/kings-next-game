<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="キングス">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>キングス 成績</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161411;
      --line: #3a3120;
      --gold: #d4af37;
      --gold-soft: #f1d77a;
      --text: #f5f1e6;
      --muted: #a39c8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(120% 60% at 50% 0%, #2a2210 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.5;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }

    .tabs { display: flex; gap: 6px; margin: 0 0 16px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs a {
      flex: none;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
    }
    .tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: #111; }

    header { text-align: center; margin-bottom: 20px; }
    .team { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--gold); }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 { margin: 28px 0 10px; font-size: 14px; color: var(--gold); letter-spacing: .1em; }
    h2:first-of-type { margin-top: 0; }
    .record { text-align: center; font-size: 14px; color: var(--muted); margin: -8px 0 20px; }
    .record b { color: var(--gold-soft); font-size: 18px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    table.season { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .season th {
      padding: 10px 6px 8px;
      font-size: 11px; font-weight: 600; color: var(--gold);
      text-align: right; white-space: nowrap;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .season th:first-child { text-align: left; padding-left: 12px; cursor: default; }
    .season th.on { color: var(--gold-soft); }
    .season th.on::after { content: " ▼"; font-size: 9px; }
    .season td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .season tr:last-child td { border-bottom: 0; }
    .season td:first-child { text-align: left; padding-left: 12px; white-space: normal; }
    .season td.main { font-weight: 800; color: var(--gold-soft); }
    .season .num { color: var(--muted); font-size: 11px; margin-right: 4px; }
    .hint { margin: 8px 2px 0; font-size: 11px; color: var(--muted); }

    .formula { padding: 4px 0; }
    .formula-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .formula-row:last-child { border-bottom: 0; }
    .formula-row .cond { font-size: 14px; font-weight: 700; }
    .formula-row .rec { font-size: 13px; font-weight: 800; color: var(--gold-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .formula-row.bad .rec { color: #ff8a80; }
    .formula-row .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #2a2620; overflow: hidden; }
    .formula-row .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); }
    .formula-row.bad .bar i { background: #ff8a80; }
    .formula h3 { margin: 10px 14px 0; font-size: 12px; color: var(--muted); font-weight: 600; }

    .watch-list { padding: 4px 0; }
    .watch-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .watch-row:last-child { border-bottom: 0; }
    .watch-row .what { font-size: 14px; font-weight: 700; }
    .watch-row .what small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
    .watch-row .left { font-size: 13px; font-weight: 800; color: var(--gold-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }

    table.standings { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .standings th { padding: 9px 5px 7px; font-size: 11px; font-weight: 600; color: var(--gold); text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .standings td { padding: 8px 5px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .standings tr:last-child td { border-bottom: 0; }
    .standings th:nth-child(-n+2), .standings td:nth-child(-n+2) { text-align: left; }
    .standings td:first-child, .standings th:first-child { padding-left: 12px; width: 1.5em; }
    .standings tr.me td { background: rgba(212,175,55,.16); color: var(--gold-soft); font-weight: 800; }

    .game { padding: 14px 14px 12px; margin-bottom: 10px; }
    .game-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .game-date { font-size: 12px; color: var(--muted); }
    .ha { font-size: 11px; color: var(--gold); margin-left: 6px; }
    .game-vs { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .result { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .result .w { color: var(--gold-soft); }
    .result .l { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font-size: 12px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      white-space: nowrap;
    }
    .chip b { color: var(--gold-soft); margin-left: 4px; font-variant-numeric: tabular-nums; }
    .chip.top { border-color: var(--gold); }
    .game a.box { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--gold); text-decoration: none; }

    .message { text-align: center; color: var(--muted); padding: 40px 0; }
    .note { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <nav class="tabs">
      <a href="./">次の試合</a>
      <a href="players.html">選手一覧</a>
      <a href="stats.html" aria-current="page">成績</a>
      <a href="dancers.html">ダンサーズ</a>
    </nav>
    <header>
      <p class="team">RYUKYU GOLDEN KINGS</p>
      <h1>STATS</h1>
    </header>
    <div id="app"><p class="message">読み込み中…</p></div>
    <p class="note" id="note"></p>
  </main>

  <script src="extras.js"></script>
  <script>
    const TZ = "Asia/Tokyo";
    const fmtDate = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, month: "numeric", day: "numeric", weekday: "short" });
    const app = document.getElementById("app");
    const COLS = [
      { key: "gp", label: "試合" },
      { key: "ppg", label: "得点" },
      { key: "pts", label: "合計" },
      { key: "rpg", label: "リバ" },
      { key: "apg", label: "アシ" },
    ];
    let games = [];
    let sortKey = "ppg";
    let standings = null;

    // ---------------------------------------------------------------- 勝利の方程式
    // 「○○が20点以上」のような条件ごとに、その条件を満たした試合の勝敗を数え、
    // 勝率がとくに高い(低い)ものを「勝ちパターン」(「負けパターン」)として出す
    const shortName = n => n.includes(" ") ? n.split(" ")[0] : n.split("・").pop();
    const FORMULA_MIN_GAMES = 3;

    function formulaConditions() {
      const conds = [];
      const names = [...new Set(games.flatMap(g => (g.players || []).map(p => p.name)))];
      const stat = (g, name) => (g.players || []).find(p => p.name === name && played(p));
      // 1試合平均の得点(出場した試合だけ)。「○点未満」は主力選手(平均8点以上)だけに使う
      const ppg = name => {
        const rows = games.map(g => stat(g, name)).filter(Boolean);
        return rows.length ? rows.reduce((a, p) => a + (p.pts || 0), 0) / rows.length : 0;
      };
      for (const name of names) {
        const sn = shortName(name);
        for (const th of [10, 15, 20, 25]) {
          conds.push({ group: name + ":pts+", text: `${sn}が${th}点以上`, test: g => { const p = stat(g, name); return p ? p.pts >= th : null; } });
        }
        if (ppg(name) >= 8) {
          for (const th of [5, 10]) {
            conds.push({ group: name + ":pts-", only: "bad", text: `${sn}が${th}点未満`, test: g => { const p = stat(g, name); return p ? p.pts < th : null; } });
          }
        }
        conds.push({ group: name + ":reb", text: `${sn}が2桁リバウンド`, test: g => { const p = stat(g, name); return p ? p.reb >= 10 : null; } });
        conds.push({ group: name + ":ast", text: `${sn}が5アシスト以上`, test: g => { const p = stat(g, name); return p ? p.ast >= 5 : null; } });
      }
      for (const k of [3, 4, 5]) {
        conds.push({ group: "dd+", text: `2桁得点の選手が${k}人以上`, test: g => (g.players || []).filter(p => p.pts >= 10).length >= k });
      }
      conds.push({ group: "dd-", only: "bad", text: "2桁得点の選手が2人以下", test: g => (g.players || []).filter(p => p.pts >= 10).length <= 2 });
      for (const th of [80, 90]) conds.push({ group: "pts", text: `チームで${th}点以上`, test: g => g.kings >= th });
      for (const th of [75, 80]) conds.push({ group: "opp", text: `失点${th}点以下`, test: g => g.opp <= th });
      conds.push({ group: "opp+", only: "bad", text: "失点90点以上", test: g => g.opp >= 90 });
      conds.push({ group: "home", text: "ホームゲーム", test: g => !!g.home });
      conds.push({ group: "away", text: "アウェイゲーム", test: g => !g.home });
      return conds;
    }

    function formulas() {
      const all = games.length;
      const overall = all ? games.filter(g => g.kings > g.opp).length / all : 0;
      const results = formulaConditions().map(c => {
        const hit = games.filter(g => c.test(g) === true);
        const w = hit.filter(g => g.kings > g.opp).length;
        return { ...c, n: hit.length, w, l: hit.length - w, pct: hit.length ? w / hit.length : 0 };
      }).filter(r => r.n >= FORMULA_MIN_GAMES);
      // 同じ選手・同じ種類の条件は、いちばん強いものだけ残す
      const pick = (list, better) => {
        const seen = new Set();
        return list.sort(better).filter(r => !seen.has(r.group) && seen.add(r.group));
      };
      const good = pick(results.filter(r => r.only !== "bad" && r.pct >= 0.75 && r.pct > overall), (a, b) => b.pct - a.pct || b.n - a.n).slice(0, 5);
      const bad = pick(results.filter(r => r.pct <= 0.25 && r.pct < overall), (a, b) => a.pct - b.pct || b.n - a.n).slice(0, 3);
      return { good, bad };
    }

    function formulaHtml() {
      if (games.length < 5) return "";
      const { good, bad } = formulas();
      if (!good.length && !bad.length) return "";
      const row = (r, cls) => `
        <div class="formula-row ${cls}">
          <span class="cond">${esc(r.text)}</span><span class="rec">${r.w}勝${r.l}敗</span>
          <span class="bar"><i style="width:${Math.round(r.pct * 100)}%"></i></span>
        </div>`;
      return `
        <h2>勝利の方程式</h2>
        <div class="card formula">
          ${good.length ? `<h3>この条件を満たすと勝ちやすい</h3>${good.map(r => row(r, "")).join("")}` : ""}
          ${bad.length ? `<h3>この形になると負けやすい</h3>${bad.map(r => row(r, "bad")).join("")}` : ""}
        </div>
        <p class="hint">今シーズンの試合から自動で見つけています（条件を満たした試合が${FORMULA_MIN_GAMES}試合以上のものだけ）。試合が増えると変わります。</p>`;
    }

    // ---------------------------------------------------------------- 記録達成ウォッチ
    let rosterPlayers = [];

    function watchHtml() {
      const list = KingsExtras.milestones(rosterPlayers).slice(0, 8);
      if (!list.length) return "";
      return `
        <h2>記録達成ウォッチ</h2>
        <div class="card watch-list">
          ${list.map(m => `
            <div class="watch-row">
              <span class="what">#${m.player.number ?? "-"} ${esc(m.name)}<small>B.LEAGUE 通算 ${m.goal.toLocaleString()}${esc(m.kind.label)}</small></span>
              <span class="left">あと ${m.left}${esc(m.kind.unit)}<br><small style="font-weight:400;color:var(--muted)">今のペースで約${m.games}試合</small></span>
            </div>`).join("")}
        </div>
        <p class="hint">B.LEAGUE 公式の選手ページの通算成績（B1・B2・B.PREMIER のリーグ戦の合計）から、今のペースで${5}試合以内に届きそうな節目を出しています。通算成績は1日1回更新です。</p>`;
    }

    function standingsHtml() {
      if (!standings || !Array.isArray(standings.rows) || !standings.rows.length) return "";
      return `
        <h2>順位（${esc(standings.division || "地区")}）</h2>
        <div class="card">
          <table class="standings">
            <tr><th>#</th><th>クラブ</th><th>勝</th><th>負</th><th>勝率</th><th>差</th><th>連勝</th></tr>
            ${standings.rows.map(r => `
              <tr class="${r.kings ? "me" : ""}">
                <td>${r.rank ?? ""}</td><td>${esc(r.short || r.team)}</td><td>${r.w}</td><td>${r.l}</td>
                <td>${esc(r.pct)}</td><td>${esc(r.gb)}</td><td>${esc(r.streak)}</td>
              </tr>`).join("")}
          </table>
        </div>
        <p class="hint">「差」は首位とのゲーム差。「連勝」の W は連勝、L は連敗です。</p>`;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // 出場時間が 0 の選手(ベンチ入りのみ)は、その試合に出ていないとみなす
    const played = p => p.min && !/^0?0:00$/.test(p.min);

    function seasonTotals() {
      const by = new Map();
      for (const g of games) {
        for (const p of g.players || []) {
          const s = by.get(p.name) || { name: p.name, number: p.number, gp: 0, pts: 0, reb: 0, ast: 0 };
          s.number = p.number;
          if (played(p)) {
            s.gp += 1;
            s.pts += p.pts || 0;
            s.reb += p.reb || 0;
            s.ast += p.ast || 0;
          }
          by.set(p.name, s);
        }
      }
      return [...by.values()].filter(s => s.gp > 0).map(s => ({
        ...s, ppg: s.pts / s.gp, rpg: s.reb / s.gp, apg: s.ast / s.gp,
      }));
    }

    function render() {
      if (!games.length) {
        app.innerHTML = standingsHtml() + '<p class="message">まだ終わった試合の成績がありません。</p>';
        return;
      }
      const wins = games.filter(g => g.kings > g.opp).length;
      const rows = seasonTotals().sort((a, b) => b[sortKey] - a[sortKey] || b.ppg - a.ppg);
      const f1 = v => v.toFixed(1);
      const show = (s, k) => (k === "ppg" || k === "rpg" || k === "apg") ? f1(s[k]) : s[k];

      app.innerHTML = `
        <p class="record">今シーズン <b>${wins}勝 ${games.length - wins}敗</b>（${games.length}試合）</p>
        ${standingsHtml()}
        ${formulaHtml()}
        ${watchHtml()}
        <h2>シーズン成績（1試合平均）</h2>
        <div class="card">
          <table class="season">
            <tr><th>選手</th>${COLS.map(c => `<th data-key="${c.key}" class="${c.key === sortKey ? "on" : ""}">${c.label}</th>`).join("")}</tr>
            ${rows.map(s => `
              <tr>
                <td><span class="num">#${s.number ?? "-"}</span>${esc(s.name)}</td>
                ${COLS.map(c => `<td class="${c.key === sortKey ? "main" : ""}">${show(s, c.key)}</td>`).join("")}
              </tr>`).join("")}
          </table>
        </div>
        <p class="hint">見出しをタップすると並び替えられます。「合計」は今シーズンの合計得点です。</p>

        <h2>試合ごとの得点</h2>
        ${games.slice().reverse().map(g => {
          const win = g.kings > g.opp;
          const scorers = (g.players || []).filter(p => (p.pts || 0) > 0).sort((a, b) => b.pts - a.pts);
          return `
            <div class="card game">
              <div class="game-top">
                <div>
                  <div class="game-date">${fmtDate.format(new Date(g.datetime))}<span class="ha">${g.home ? "HOME" : "AWAY"}</span></div>
                  <div class="game-vs">vs ${esc(g.opponent)}</div>
                </div>
                <div class="result"><span class="${win ? "w" : "l"}">${win ? "WIN" : "LOSE"}</span> ${g.kings}-${g.opp}</div>
              </div>
              <div class="chips">
                ${scorers.map((p, i) => `<span class="chip${i < 3 ? " top" : ""}">${esc(p.name)}<b>${p.pts}</b></span>`).join("") || '<span class="chip">得点の記録なし</span>'}
              </div>
              ${g.url ? `<a class="box" href="${esc(g.url)}" target="_blank" rel="noopener">B.LEAGUE 公式のボックススコア ›</a>` : ""}
            </div>`;
        }).join("")}
      `;
    }

    app.addEventListener("click", e => {
      const th = e.target.closest("th[data-key]");
      if (!th) return;
      sortKey = th.dataset.key;
      render();
    });

    fetch("games.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        games = (Array.isArray(data.games) ? data.games : []).slice().sort((a, b) => a.datetime < b.datetime ? -1 : 1);
        if (data.updated) document.getElementById("note").textContent = `B.LEAGUE 公式サイトから自動で更新しています（最終更新 ${data.updated}）`;
        render();
      })
      .catch(() => {
        app.innerHTML = '<p class="message">成績を読み込めませんでした。</p>';
      });

    fetch("players.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        rosterPlayers = data && Array.isArray(data.players) ? data.players : [];
        if (games.length) render();
      })
      .catch(() => {});

    fetch("standings.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        standings = data;
        if (games.length) render();
      })
      .catch(() => {});
  </script>
</body>
</html>
