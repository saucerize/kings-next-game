name: 試合結果の通知

on:
  schedule:
    - cron: "7,22,37,52 1-14 * * *"   # 日本時間 10:07〜23:52 に15分おき(試合中なら終わるまで待って送る)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-result
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pywebpush
      - name: 登録を集めて、試合結果を送る
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "VAPID_PRIVATE_KEY が未設定なので何もしません(Settings → Secrets and variables → Actions で設定してください)"
            exit 0
          fi
          python push_result.py
      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain -- push)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push
          git commit -m "通知の登録・送信を記録"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
