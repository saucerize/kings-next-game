name: diag-live
on:
  push:
    branches: [claude/ryukyu-kings-next-game-5n8x6r]
    paths: [.github/workflows/diag.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (kings-next-game personal use)"
          for u in https://goldenkings.jp/renewal_news/ https://goldenkings.jp/news/; do
          curl -sL -A "$UA" "$u" > p.html
          python3 - "$u" <<'PY'
          import re, sys
          h = open("p.html", encoding="utf-8", errors="ignore").read()
          print("=====", sys.argv[1], len(h))
          ds = [m.start() for m in re.finditer(r'20\d\d[./年-]\s?\d{1,2}[./月-]\s?\d{1,2}', h)]
          print("dates", len(ds))
          if len(ds) > 3:
              i = ds[3]; print(re.sub(r"\s+", " ", h[i-1000:i+600]))
          hrefs = sorted(set(re.findall(r'href="(https://goldenkings\.jp/[a-z_]+(?:_detail\d*)?/[^"]*id=\d+)"', h)))
          print("id links", len(hrefs), hrefs[:8])
          PY
          done
