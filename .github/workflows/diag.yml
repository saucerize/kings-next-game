name: diag-live
on:
  push:
    branches: [claude/ryukyu-kings-next-game-5n8x6r]
    paths: [.github/workflows/diag.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- difftest (posted ~1 min ago)"; curl -s "https://ntfy.sh/kings-difftest-a38853caea/json?poll=1&since=all" | head -c 300
          echo; echo "--- live: listen to the real-time stream for 75s"
          timeout 75 curl -s -N "https://ntfy.sh/kings-live-a38853caea/json" | cut -c1-260 || true
          echo; echo "--- live history"; curl -s "https://ntfy.sh/kings-live-a38853caea/json?poll=1&since=all" | wc -l
