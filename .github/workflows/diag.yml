name: 調査(一時的)
on:
  push:
    branches: [claude/ryukyu-kings-next-game-5n8x6r]
    paths: [diag/**, .github/workflows/diag.yml, update_players.py]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 試す(コミットはしない)
        run: |
          python update_players.py > /dev/null
          python -c "import json;[print(json.dumps({k:p[k] for k in ('id','name','birthday','career','season')},ensure_ascii=False)) for p in json.load(open('players.json'))['players']]"
