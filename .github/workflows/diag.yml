name: diag-live
on:
  push:
    branches: [claude/ryukyu-kings-next-game-5n8x6r]
    paths: [.github/workflows/diag.yml]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (kings-next-game personal use)"
          curl -sL -A "$UA" https://goldenkings.jp/RSS.rdf > rss.xml; echo "rss bytes $(wc -c < rss.xml)"; head -c 2500 rss.xml; echo
          grep -c "<item" rss.xml
          curl -sL -A "$UA" "https://www.youtube.com/feeds/videos.xml?channel_id=UCBUFfz9DwYS5nECTHql8mAQ" > yt.xml; echo "yt bytes $(wc -c < yt.xml)"; grep -c "<entry>" yt.xml
          python3 - <<'PY'
          h = open("yt.xml", encoding="utf-8").read(); i = h.find("<entry>"); print(h[i:i+1800])
          PY
