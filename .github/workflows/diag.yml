name: 調査(一時的)
on:
  push:
    branches: [claude/ryukyu-kings-next-game-5n8x6r]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 予定の読み取りを試す(コミットはしない)
        run: python update_schedule.py && cat schedule.json
