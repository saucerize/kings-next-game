<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="キングス">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>キングス ダンサーズ</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161411;
      --line: #3a3120;
      --gold: #d4af37;
      --gold-soft: #f1d77a;
      --text: #f5f1e6;
      --muted: #a39c8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(120% 60% at 50% 0%, #2a2210 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.5;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }

    /* 上のタブ: 横幅いっぱいの4つのボタン(アイコン+名前)。指で押しやすい高さにする */
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 18px; }
    .tabs a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 58px;
      padding: 6px 2px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tabs a:active { transform: scale(.96); }
    .tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: #111; }

    header { text-align: center; margin-bottom: 20px; }
    .team { margin: 0; font-size: 13px; letter-spacing: .2em; color: var(--gold); }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead { margin: -6px 0 18px; text-align: center; font-size: 12px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .dancer {
      display: block;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .dancer .photo { aspect-ratio: 3 / 4; background: radial-gradient(90% 70% at 50% 30%, #2a2210 0%, #0f0e0b 70%); }
    .dancer img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .dancer .name { padding: 7px 8px 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; overflow-wrap: anywhere; }

    .viewer {
      position: fixed; inset: 0; z-index: 10;
      display: none; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, .88);
    }
    .viewer.open { display: flex; }
    .viewer img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    .viewer .close {
      position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--card); color: var(--gold-soft);
      font-size: 22px; line-height: 1; cursor: pointer;
    }

    .message { text-align: center; color: var(--muted); padding: 40px 0; }
    .note { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
    .note a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <nav class="tabs">
      <a href="./"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="2.2"/></svg><span>次の試合</span></a>
      <a href="players.html"><svg viewBox="0 0 24 24"><path d="M8 3l-4 3 2 4h2v11h8V10h2l2-4-4-3c-.5 1.7-2 3-4 3s-3.5-1.3-4-3z"/></svg><span>選手一覧</span></a>
      <a href="stats.html"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>成績</span></a>
      <a href="dancers.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>ダンサーズ</span></a>
    </nav>
    <header>
      <p class="team">RYUKYU GOLDEN KINGS</p>
      <h1>KINGS DANCERS</h1>
    </header>
    <p class="lead">写真をタップするとプロフィールが見られます</p>
    <div id="app"><p class="message">読み込み中…</p></div>
    <p class="note" id="note"></p>
  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true">
    <button type="button" class="close" aria-label="閉じる">×</button>
    <img id="viewerImg" alt="">
  </div>

  <script>
    const app = document.getElementById("app");
    const viewer = document.getElementById("viewer");
    const viewerImg = document.getElementById("viewerImg");
    let dancers = [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      if (!dancers.length) {
        app.innerHTML = '<p class="message">まだダンサーズの情報がありません。</p>';
        return;
      }
      app.innerHTML = `<div class="grid">${dancers.map((d, i) => `
        <button type="button" class="dancer" data-i="${i}">
          <div class="photo">${d.photo ? `<img src="${esc(d.photo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
          <div class="name">${esc(d.name)}</div>
        </button>`).join("")}</div>`;
    }

    // プロフィール画像を画面いっぱいに表示する。画像の外か「×」をタップすると閉じる
    function openViewer(d) {
      const src = d.profile || d.photo;
      if (!src) return;
      viewerImg.src = src;
      viewerImg.alt = d.name;
      viewer.classList.add("open");
    }
    function closeViewer() {
      viewer.classList.remove("open");
      viewerImg.removeAttribute("src");
    }
    app.addEventListener("click", e => {
      const b = e.target.closest("button[data-i]");
      if (b) openViewer(dancers[Number(b.dataset.i)]);
    });
    viewer.addEventListener("click", e => { if (e.target !== viewerImg) closeViewer(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

    fetch("dancers.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        dancers = Array.isArray(data.dancers) ? data.dancers : [];
        document.getElementById("note").innerHTML =
          `キングス公式サイトから自動で更新しています${data.updated ? `（最終更新 ${esc(data.updated)}）` : ""}<br>` +
          `<a href="${esc(data.source || "https://goldenkings.jp/team/dancers/")}" target="_blank" rel="noopener">公式サイトのダンサーズのページ ›</a>`;
        render();
      })
      .catch(() => {
        app.innerHTML = '<p class="message">ダンサーズを読み込めませんでした。</p>';
      });
  </script>
</body>
</html>
