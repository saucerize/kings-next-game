<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="キングス">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <title>キングス 次の試合</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --card: #161411;
      --line: #3a3120;
      --gold: #d4af37;
      --gold-soft: #f1d77a;
      --text: #f5f1e6;
      --muted: #a39c8a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(120% 60% at 50% 0%, #2a2210 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.5;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }

    /* 上のタブ: 横幅いっぱいの4つのボタン(アイコン+名前)。指で押しやすい高さにする */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 18px; }
    .tabs a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 58px;
      padding: 6px 2px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .tabs a:active { transform: scale(.96); }
    .tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabs a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: #111; }

    header { text-align: center; margin-bottom: 20px; }
    .team {
      margin: 0;
      font-size: 13px;
      letter-spacing: .2em;
      color: var(--gold);
    }
    h1 {
      margin: 4px 0 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(212,175,55,.15);
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
    }
    .badge.home { background: var(--gold); color: #111; }
    .badge.away { border: 1px solid var(--gold); color: var(--gold); }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .live {
      font-size: 13px; font-weight: 700; color: #ff5a5a;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: .35; } }

    .vs { margin: 20px 0 4px; font-size: 14px; color: var(--muted); }
    .opponent { margin: 0; font-size: 26px; font-weight: 800; }

    dl { margin: 20px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; }
    dt { color: var(--gold); font-size: 13px; padding-top: 2px; }
    dd { margin: 0; font-size: 17px; font-weight: 600; }

    .birthday {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(212,175,55,.22), rgba(212,175,55,.06));
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-soft);
    }
    .birthday small { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; color: var(--muted); }
    .birthday.next {
      padding: 8px 12px;
      border-color: var(--line);
      background: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .birthday.next b { color: var(--gold-soft); }
    .milestone {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(212,175,55,.1);
      font-size: 13px;
      line-height: 1.6;
    }
    .milestone b { color: var(--gold-soft); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .actions a {
      display: block;
      padding: 11px 8px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }
    .actions .ticket { background: var(--gold); color: #111; }
    .actions .watch { border: 1px solid var(--gold); color: var(--gold-soft); }
    .actions a:only-child { grid-column: 1 / -1; }
    .calendar { margin-top: 20px; padding: 14px 12px 12px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; }
    .calendar p { margin: 0; font-size: 14px; font-weight: 700; color: var(--gold-soft); }
    .calendar small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
    .calendar .cal-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .calendar a {
      display: block;
      padding: 9px 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }
    .official {
      display: inline-block;
      margin-top: 16px;
      font-size: 14px;
      color: var(--gold);
      text-decoration: none;
    }
    .countdown {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .countdown .label { font-size: 13px; color: var(--muted); }
    .units { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .unit {
      background: #0f0e0b;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 0 6px;
    }
    .num {
      display: block;
      font-size: 30px;
      font-weight: 800;
      color: var(--gold-soft);
      font-variant-numeric: tabular-nums;
    }
    .unit small { font-size: 11px; color: var(--muted); }

    h2 { margin: 28px 0 10px; font-size: 14px; color: var(--gold); letter-spacing: .1em; }
    h2.section:first-child { margin-top: 0; }

    .live-card { margin-bottom: 8px; border-color: var(--gold); }

    /* スコアボード(X の試合ページ風) */
    .board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 16px 0 6px; }
    .board .team { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; margin: 0; color: var(--text); letter-spacing: normal; font-size: inherit; }
    .board .tmark {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 800;
      border: 2px solid var(--gold);
    }
    .board .kings .tmark { background: var(--gold); color: #111; }
    .board .opp .tmark { background: #26221a; color: var(--text); border-color: #5a5040; }
    .board .tname { font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board .pts { font-size: 54px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .board .kings .pts { color: var(--gold-soft); }
    .board .mid { text-align: center; }
    .board .per { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; }
    .board .clock { margin-top: 4px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .court-wrap { margin: 10px -6px 0; perspective: 700px; }
    .court { display: block; width: 100%; transform: rotateX(32deg); transform-origin: 50% 100%; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
    .lastplay {
      position: relative; z-index: 1;
      margin-top: -6px; padding: 10px 12px;
      border-radius: 12px; background: rgba(38,34,26,.95); border: 1px solid var(--line);
      font-size: 13px; line-height: 1.5;
    }
    .lastplay small { color: var(--muted); margin-left: 6px; }
    .lastplay b { color: var(--gold-soft); }
    .live-tabs { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 0 4px; border-bottom: 1px solid var(--line); }
    .live-tabs button {
      min-height: 44px; border: 0; background: none; color: var(--muted);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .live-tabs button.on { color: var(--text); border-bottom-color: var(--gold); }
    table.box { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    .box th { padding: 6px 4px; font-size: 10px; font-weight: 600; color: var(--gold); text-align: right; border-bottom: 1px solid var(--line); }
    .box td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .box th:first-child, .box td:first-child { text-align: left; white-space: normal; }
    .box h3 { margin: 14px 0 4px; font-size: 13px; }
    .plays { list-style: none; margin: 0; padding: 0; }
    .plays li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .plays .t { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .plays .sc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .plays li.k .what { color: var(--gold-soft); }

    /* 勝敗予想と応援リアクション */
    .fan { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .fan-title { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    .fan-title small { color: var(--muted); font-weight: 400; }
    .vote { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .vote button {
      position: relative; overflow: hidden;
      min-height: 50px; padding: 4px 26px; border-radius: 999px; border: 1px solid var(--line);
      font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap;
    }
    .vote .vk { background: var(--gold); color: #111; border-color: var(--gold); }
    .vote .vo { background: #2a261e; color: var(--text); }
    .vote button.mine::after { content: "✓"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
    .vote button:disabled { cursor: default; }
    .vote button:not(:disabled):active { transform: scale(.97); }
    .reacts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
    .reacts button {
      min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #161411;
      font: inherit; font-size: 22px; line-height: 1; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      -webkit-tap-highlight-color: transparent;
    }
    .reacts button:active { transform: scale(.92); }
    .reacts small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .fan-note { margin: 8px 0 0; font-size: 10px; color: var(--muted); }
    .float-emoji {
      position: fixed; bottom: 90px; z-index: 50; pointer-events: none;
      font-size: 30px; animation: floatUp 2.2s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(.6); opacity: 0; }
      15% { opacity: 1; transform: translateY(-30px) scale(1.1); }
      100% { transform: translateY(-320px) scale(1); opacity: 0; }
    }
    .winprob { margin-top: 14px; }
    .winprob-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
    .winprob-head b { font-size: 20px; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
    .winprob-bar { position: relative; height: 10px; margin-top: 6px; border-radius: 5px; background: #3a2a2a; overflow: hidden; }
    .winprob-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); transition: width .6s; }
    .winprob-bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); }
    .winprob small { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); }
    .final { font-size: 13px; font-weight: 700; color: var(--gold-soft); }
    .score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 8px;
      margin: 20px 0 4px;
      text-align: center;
    }
    .side { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .tname { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .pts {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .kings .pts { color: var(--gold-soft); }
    .dash { font-size: 28px; color: var(--muted); padding-bottom: 8px; }
    .quarters {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 14px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .quarters th { color: var(--gold); font-weight: 600; font-size: 12px; padding: 4px 2px; }
    .quarters td { padding: 6px 2px; border-top: 1px solid var(--line); }
    .quarters td:first-child { text-align: left; color: var(--muted); font-size: 12px; }
    .scorers { list-style: none; margin: 0; padding: 0; }
    .scorers li {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 8px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .spts { font-weight: 800; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
    .spts small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 2px; }
    .sub { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
    .sub .official { margin-top: 0; font-size: 12px; }
    .later { list-style: none; margin: 0; padding: 0; }
    .later li {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .later .ha { color: var(--gold); font-size: 13px; white-space: nowrap; }

    .message { text-align: center; color: var(--muted); padding: 40px 0; }
    .note { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>

    <header>
      <p class="team">RYUKYU GOLDEN KINGS</p>
      <h1>NEXT GAME</h1>
    </header>
    <div id="birthday"></div>
    <div id="app"><p class="message">読み込み中…</p></div>
    <div class="calendar">
      <p>📅 試合予定をカレンダーに登録</p>
      <small>予定も試合結果も、あとから自動で反映されます</small>
      <div class="cal-links">
        <a id="calApple" href="calendar.ics">iPhone のカレンダー</a>
        <a id="calGoogle" href="https://calendar.google.com/" target="_blank" rel="noopener">Google カレンダー</a>
      </div>

  <script src="extras.js"></script>
  <script>
    // 試合開始からこの時間が過ぎたら「終わった試合」とみなして次へ進む
    const GAME_LENGTH_MS = 2.5 * 60 * 60 * 1000;
    const TZ = "Asia/Tokyo";

    // 試合中の速報(kings-notify の notifier.py が ntfy に流している)
    const NTFY = "https://ntfy.sh";
    const LIVE_TOPIC = "kings-live-a38853caea";
    const LIVE_STALE_MS = 15 * 60 * 1000;       // この時間更新がなければ速報を隠す
    const FINAL_SHOW_MS = 3 * 60 * 60 * 1000;    // 試合終了の結果を出しておく時間
    const LIVE_WINDOW_BEFORE_MS = 30 * 60 * 1000;
    const LIVE_WINDOW_AFTER_MS = 4 * 60 * 60 * 1000;

    const app = document.getElementById("app");
    let timer = null;
    let games = [];
    let live = null;
    let source = null;
    let roster = [];   // players.json(誕生日・通算成績)

    // 誕生日の選手がいれば大きく、いなければ次の誕生日を小さく出す
    function renderBirthday() {
      const list = KingsExtras.birthdaysToday(roster);
      const next = list.length ? null : KingsExtras.nextBirthday(roster);
      document.getElementById("birthday").innerHTML = list.length ? `
        <div class="birthday">🎂 今日は ${list.map(b => `${esc(b.name)}選手（${b.age}歳）`).join("・")} の誕生日！
          <small>おめでとうございます！</small></div>`
        : next ? `<div class="birthday next">🎂 次の誕生日：<b>${esc(next.name)}</b>選手
            ${esc(KingsExtras.birthdayLabel(next.player))}（${next.days === 1 ? "明日" : `あと${next.days}日`}）</div>` : "";
    }

    // 次の試合で届きそうな通算記録(今のペースで1試合以内)。無ければ、いちばん近い記録を出す
    function milestoneHtml() {
      const all = KingsExtras.milestones(roster);
      const soon = all.filter(m => m.games <= 1);
      const line = m => `<b>${esc(m.name)}</b> B.LEAGUE 通算${m.goal.toLocaleString()}${esc(m.kind.label)}まで あと${m.left}${esc(m.kind.unit)}`;
      if (soon.length) return `<div class="milestone">🏆 この試合で記録達成なるか？<br>${soon.map(line).join("<br>")}</div>`;
      if (!all.length) return "";
      return `<div class="milestone">🏆 次に近い記録：${line(all[0])}（今のペースで約${all[0].games}試合）</div>`;
    }

    const fmtDate = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, year: "numeric", month: "long", day: "numeric", weekday: "short" });
    const fmtTime = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    const fmtShort = new Intl.DateTimeFormat("ja-JP", { timeZone: TZ, month: "numeric", day: "numeric", weekday: "short" });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function upcoming(now) {
      return games
        .map(g => ({ ...g, start: new Date(g.datetime) }))
        .filter(g => !isNaN(g.start) && g.start.getTime() + GAME_LENGTH_MS > now)
        .sort((a, b) => a.start - b.start);
    }

    // ---------------------------------------------------------------- 試合中の速報
    function liveState(now) {
      if (!live) return null;
      const age = now - new Date(live.updated).getTime();
      if (live.period === "FINAL") return age < FINAL_SHOW_MS ? "final" : null;
      return age < LIVE_STALE_MS ? "live" : null;
    }

    // ---------------------------------------------------------------- 勝利確率メーター(目安)
    // 残り時間は秒単位では分からないので、「今のクォーターに入った点数」を「それまでのクォーターの
    // 平均点数」と比べて、クォーターがどこまで進んだかを推定する(分からなければ半分進んだとみなす)。
    // 最終点差のばらつき(標準偏差)を1試合40分で約13点とし、残り時間に応じて縮めた正規分布で計算する
    const MARGIN_SD = 13;
    const HOME_EDGE = 2;   // ホームの有利さ(1試合あたりの点数)

    function normalCdf(x) {
      // erf の近似(Abramowitz-Stegun 7.1.26)
      const t = 1 / (1 + 0.3275911 * Math.abs(x) / Math.SQRT2);
      const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x / 2);
      return x >= 0 ? (1 + y) / 2 : (1 - y) / 2;
    }

    function remainingMinutes(d) {
      const p = d.period || "";
      if (p === "HALF") return 20;
      const qi = /^Q[1-4]$/.test(p) ? Number(p[1]) - 1 : /^OT\d*$/.test(p) ? 3 + (Number(p.slice(2)) || 1) : null;
      if (qi == null) return null;
      const len = qi >= 4 ? 5 : 10;              // 延長は5分
      const after = qi < 4 ? (3 - qi) * 10 : 0;   // このあとに残っているクォーターの時間
      const qs = Array.isArray(d.quarters) ? d.quarters.filter(q => Array.isArray(q) && q.length === 3) : [];
      let progress = 0.5;
      if (qs[qi] && qi > 0) {
        const prev = qs.slice(0, Math.min(qi, 4));
        const avg = prev.reduce((a, q) => a + q[1] + q[2], 0) / prev.length * (len / 10);
        if (avg > 0) progress = Math.min(0.95, Math.max(0.05, (qs[qi][1] + qs[qi][2]) / avg));
      }
      return after + len * (1 - progress);
    }

    function winProbability(d) {
      const remaining = remainingMinutes(d);
      if (remaining == null) return null;
      const frac = remaining / 40;
      const edge = (d.home ? HOME_EDGE : -HOME_EDGE) * frac;
      return normalCdf((d.kings - d.opp + edge) / (MARGIN_SD * Math.sqrt(frac)));
    }

    function winProbHtml(d) {
      const prob = winProbability(d);
      if (prob == null) return "";
      const pct = Math.round(Math.min(0.99, Math.max(0.01, prob)) * 100);
      return `
        <div class="winprob">
          <div class="winprob-head"><span>キングスの勝利確率</span><b>${pct}%</b></div>
          <div class="winprob-bar"><i style="width:${pct}%"></i></div>
          <small>点差と、クォーターごとの得点ペースから計算したおおまかな目安です</small>
        </div>`;
    }

    function periodLabel(p) {
      if (!p) return "試合中";
      if (p === "HALF") return "ハーフタイム";
      if (/^Q[1-4]$/.test(p)) return p[1] + "Q";
      if (/^OT\d*$/.test(p)) return "延長" + (p.slice(2) || "1");
      return p;
    }

    function acceptLive(m) {
      if (!m || m.event !== "message" || !m.message) return;
      let d;
      try { d = JSON.parse(m.message); } catch { return; }
      if (d.type !== "kings-live" || !Number.isFinite(d.kings) || !Number.isFinite(d.opp) ||
          isNaN(new Date(d.updated))) return;
      if (live && new Date(live.updated) > new Date(d.updated)) return;
      live = d;
      render();
    }

    function pollLive() {
      return fetch(`${NTFY}/${LIVE_TOPIC}/json?poll=1&since=6h`, { cache: "no-store" })
        .then(r => r.ok ? r.text() : "")
        .then(t => t.split("\n").forEach(line => {
          if (line.trim()) { try { acceptLive(JSON.parse(line)); } catch {} }
        }))
        .catch(() => {});
    }

    // 試合の前後だけ、速報の受信をつないでおく
    function nearGame(now) {
      return games.some(g => {
        const t = new Date(g.datetime).getTime();
        return t - LIVE_WINDOW_BEFORE_MS < now && now < t + LIVE_WINDOW_AFTER_MS;
      }) || liveState(now) === "live";
    }

    function updateConnection() {
      const near = nearGame(Date.now());
      if (near && !source && "EventSource" in window) {
        source = new EventSource(`${NTFY}/${LIVE_TOPIC}/sse`);
        source.onmessage = e => { try { acceptLive(JSON.parse(e.data)); } catch {} };
      } else if (!near && source) {
        source.close();
        source = null;
      }
      if (near) pollLive();   // 受信が切れていた間の取りこぼし対策
    }

    // コートの絵(上から見たコートを、CSS で手前に傾けて立体的に見せる)
    const COURT_SVG = `
      <svg class="court" viewBox="0 0 400 214" aria-hidden="true">
        <rect x="1" y="1" width="398" height="212" rx="6" fill="#2a2213" stroke="#d4af37" stroke-width="2"/>
        <g fill="none" stroke="#d4af37" stroke-opacity=".75" stroke-width="2">
          <line x1="200" y1="1" x2="200" y2="213"/>
          <circle cx="200" cy="107" r="26"/>
          <rect x="1" y="72" width="70" height="70" fill="rgba(212,175,55,.18)"/>
          <rect x="329" y="72" width="70" height="70" fill="rgba(212,175,55,.18)"/>
          <path d="M71 86a21 21 0 0 1 0 42M329 86a21 21 0 0 0 0 42"/>
          <path d="M1 20h28a90 90 0 0 1 0 174H1M399 20h-28a90 90 0 0 0 0 174h28"/>
          <circle cx="16" cy="107" r="5"/><circle cx="384" cy="107" r="5"/>
        </g>
        <g transform="translate(200 107)" fill="#d4af37">
          <path d="M-14 6L-17 -10L-7 -2L0 -14L7 -2L17 -10L14 6Z"/>
        </g>
      </svg>`;

    let liveTab = "score";   // 速報カードの中のタブ(score / box / plays)

    const teamMark = name => esc((name || "").replace(/^(.{2}).*$/, "$1"));

    function lastPlayHtml(d) {
      const p = Array.isArray(d.plays) && d.plays.length ? d.plays[0] : null;
      if (!p) return "";
      return `<div class="lastplay"><b>${esc(p.team === "kings" ? "琉球" : p.team === "opp" ? (d.opp_short || "相手") : "")}</b>
        ${esc(p.text || "")}<small>${esc([periodLabel(p.period), p.clock].filter(Boolean).join(" "))} 直近のプレー</small></div>`;
    }

    function boxHtml(d) {
      const sides = [["琉球", d.box && d.box.kings], [d.opponent || "相手", d.box && d.box.opp]];
      if (!sides.some(([, rows]) => Array.isArray(rows) && rows.length)) {
        return '<p class="sub">両チームの選手ごとの成績は、試合が始まると出ます</p>';
      }
      return sides.map(([name, rows]) => Array.isArray(rows) && rows.length ? `
        <h3 class="box">${esc(name)}</h3>
        <table class="box">
          <tr><th>選手</th><th>分</th><th>点</th><th>リバ</th><th>アシ</th></tr>
          ${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.min || "")}</td><td>${r.pts ?? 0}</td><td>${r.reb ?? 0}</td><td>${r.ast ?? 0}</td></tr>`).join("")}
        </table>` : "").join("");
    }

    function playsHtml(d) {
      const plays = Array.isArray(d.plays) ? d.plays : [];
      if (!plays.length) return '<p class="sub">プレーの記録は、試合が始まると出ます</p>';
      return `<ol class="plays">${plays.map(p => `
        <li class="${p.team === "kings" ? "k" : ""}">
          <span class="t">${esc([periodLabel(p.period), p.clock].filter(Boolean).join(" "))}</span>
          <span class="what">${esc(p.text || "")}</span>
          <span class="sc">${Number.isFinite(p.kings) && Number.isFinite(p.opp) ? `${p.kings}-${p.opp}` : ""}</span>
        </li>`).join("")}</ol>`;
    }

    function scoreTabHtml(d, state) {
      const qs = Array.isArray(d.quarters) ? d.quarters.filter(q => Array.isArray(q) && q.length === 3) : [];
      const scorers = Array.isArray(d.scorers) ? d.scorers.filter(s => Array.isArray(s) && Number.isFinite(s[1])) : [];
      return `
        ${state === "live" ? winProbHtml(d) : ""}
        ${qs.length ? `
          <table class="quarters">
            <tr><th></th>${qs.map(q => `<th>${esc(q[0])}</th>`).join("")}</tr>
            <tr><td>琉球</td>${qs.map(q => `<td>${esc(q[1])}</td>`).join("")}</tr>
            <tr><td>相手</td>${qs.map(q => `<td>${esc(q[2])}</td>`).join("")}</tr>
          </table>` : ""}
        <h2>キングスの得点</h2>
        ${scorers.length ? `
          <ol class="scorers">
            ${scorers.map(s => `<li><span>${esc(s[0])}</span><span class="spts">${s[1]}<small>点</small></span></li>`).join("")}
          </ol>` : '<p class="sub">選手ごとの得点はまだ読み取れていません</p>'}`;
    }

    function liveCard(state) {
      const d = live;
      const win = d.kings > d.opp;
      const mid = state === "final"
        ? `<div class="per">試合終了</div><div class="clock">${d.kings === d.opp ? "" : win ? "WIN" : "LOSE"}</div>`
        : `<div class="per"><span class="live">●</span> ${esc(periodLabel(d.period))}</div><div class="clock">${esc(d.clock || "LIVE")}</div>`;
      const tab = (key, label) => `<button type="button" data-live-tab="${key}" class="${liveTab === key ? "on" : ""}">${label}</button>`;
      return `
        <div class="card live-card">
          <div class="top">
            <span class="badge ${d.home ? "home" : "away"}">${d.home ? "HOME" : "AWAY"}</span>
            ${state === "final" ? '<span class="final">試合終了</span>' : '<span class="live">● LIVE</span>'}
          </div>
          <div class="board">
            <div class="team kings"><span class="tmark">琉球</span><span class="pts">${d.kings}</span><span class="tname">琉球</span></div>
            <div class="mid">${mid}</div>
            <div class="team opp"><span class="tmark">${teamMark(d.opp_short || d.opponent)}</span><span class="pts">${d.opp}</span><span class="tname">${esc(d.opponent || "")}</span></div>
          </div>
          <div class="court-wrap">${COURT_SVG}</div>
          ${lastPlayHtml(d)}
          <div class="live-tabs">${tab("score", "スコア")}${tab("box", "統計")}${tab("plays", "プレー")}</div>
          ${liveTab === "box" ? boxHtml(d) : liveTab === "plays" ? playsHtml(d) : scoreTabHtml(d, state)}
          <div id="fanSlot"></div>
          <p class="sub">${fmtTime.format(new Date(d.updated))} 更新${d.key ? `・<a class="official" href="https://www.bleague.jp/game_detail/?ScheduleKey=${encodeURIComponent(d.key)}&tab=1" target="_blank" rel="noopener">B.LEAGUE 公式 ›</a>` : ""}</p>
        </div>`;
    }

    app.addEventListener("click", e => {
      const b = e.target.closest("button[data-live-tab]");
      if (!b) return;
      liveTab = b.dataset.liveTab;
      render();
    });

    // ---------------------------------------------------------------- 勝敗予想と応援リアクション
    // ntfy の公開トピックをみんなの掲示板のように使う。投票・リアクションを送り合い、各自のブラウザで数える。
    // 同じスマホからの二重投票は防ぐ(ブラウザに覚える)が、何回も投票されるのを完全には防げない
    const FAN_TOPIC = "kings-fan-a38853caea";
    const REACTIONS = ["🔥", "👏", "😱", "❤️", "🏀"];
    const FAN_BEFORE_MS = 3 * 60 * 60 * 1000;   // 試合開始の何時間前から投票できるか
    const REACT_MAX_PER_MSG = 20;               // 1回の送信で数えるリアクションの上限(いたずら対策)

    const fan = { game: null, votes: new Map(), reacts: {}, seen: new Set(), pending: {}, source: null, el: null, flushTimer: null };
    const cid = (() => {
      try {
        let v = localStorage.getItem("kings-cid");
        if (!v) { v = Math.random().toString(36).slice(2, 12); localStorage.setItem("kings-cid", v); }
        return v;
      } catch { return Math.random().toString(36).slice(2, 12); }
    })();
    const gameId = dt => new Date(dt).toISOString();
    const myVoteKey = game => "kings-vote:" + game;
    const myVote = game => { try { return localStorage.getItem(myVoteKey(game)); } catch { return null; } };

    // 投票・リアクションを受け付ける試合(速報中の試合か、開始3時間前からの次の試合)
    let shortNames = {};   // 正式名 → 略称(standings.json から。投票ボタンに短く出すため)
    const oppShort = (full, short) => short || shortNames[full] || (full || "相手").slice(0, 4);

    function fanTarget(state, next) {
      if (state && live) return { game: gameId(live.datetime), opp: oppShort(live.opponent, live.opp_short), closed: state === "final" };
      if (next && next.start.getTime() - FAN_BEFORE_MS < Date.now()) return { game: gameId(next.datetime), opp: oppShort(next.opponent), closed: false };
      return null;
    }

    // live: リアルタイムの受信(SSE)で届いたもの。ページを開いたときに読み込む過去の分は false
    const FLOAT_RECENT_SEC = 15;   // 届いてから何秒以内のリアクションなら浮かび上がらせるか
    function acceptFan(m, live = false) {
      if (!m || m.event !== "message" || !m.message || fan.seen.has(m.id)) return;
      fan.seen.add(m.id);
      let d;
      try { d = JSON.parse(m.message); } catch { return; }
      if (d.type !== "kings-fan" || d.game !== fan.game || typeof d.cid !== "string") return;
      if (d.kind === "vote" && (d.pick === "kings" || d.pick === "opp")) {
        fan.votes.set(d.cid, d.pick);
      } else if (d.kind === "react" && d.counts && typeof d.counts === "object") {
        for (const e of REACTIONS) {
          const n = Math.min(REACT_MAX_PER_MSG, Math.max(0, Math.floor(Number(d.counts[e]) || 0)));
          if (!n) continue;
          fan.reacts[e] = (fan.reacts[e] || 0) + n;
          // 浮かび上がらせるのは、いま届いた他の人のリアクションだけ(過去の分は数に足すだけ。自分の分は押したときに出している)
          if (live && d.cid !== cid && Date.now() / 1000 - (m.time || 0) <= FLOAT_RECENT_SEC) floatEmoji(e, Math.min(n, 4));
        }
      }
      updateFanView();
    }

    function sendFan(body) {
      fetch(`${NTFY}/${FAN_TOPIC}`, { method: "POST", body: JSON.stringify({ type: "kings-fan", v: 1, game: fan.game, cid, ...body }) })
        .catch(() => {});
    }

    function vote(pick) {
      if (!fan.game || myVote(fan.game)) return;
      try { localStorage.setItem(myVoteKey(fan.game), pick); } catch {}
      fan.votes.set(cid, pick);
      sendFan({ kind: "vote", pick });
      updateFanView();
    }

    // リアクションは押すたびにすぐ画面に出し、送信は2秒ごとにまとめる(ntfy の送信回数の制限に配慮)
    function react(e) {
      if (!fan.game) return;
      fan.reacts[e] = (fan.reacts[e] || 0) + 1;
      fan.pending[e] = Math.min(REACT_MAX_PER_MSG, (fan.pending[e] || 0) + 1);
      floatEmoji(e, 1);
      updateFanView();
      if (!fan.flushTimer) {
        fan.flushTimer = setTimeout(() => {
          fan.flushTimer = null;
          const counts = fan.pending;
          fan.pending = {};
          if (Object.keys(counts).length) sendFan({ kind: "react", counts });
        }, 2000);
      }
    }

    let floating = 0;
    function floatEmoji(e, n) {
      for (let i = 0; i < n && floating < 25; i++) {
        floating++;
        const el = document.createElement("span");
        el.className = "float-emoji";
        el.textContent = e;
        el.style.left = (10 + Math.random() * 75) + "vw";
        el.style.animationDelay = (i * 0.15) + "s";
        el.addEventListener("animationend", () => { el.remove(); floating--; });
        document.body.appendChild(el);
      }
    }

    function fanElement() {
      if (fan.el) return fan.el;
      const el = document.createElement("div");
      el.className = "fan";
      el.innerHTML = `
        <div class="fan-title"><span>どっちが勝つ？</span><small id="fanVotes"></small></div>
        <div class="vote">
          <button type="button" class="vk" data-vote="kings"></button>
          <button type="button" class="vo" data-vote="opp"></button>
        </div>
        <div class="fan-title" style="margin-top:14px"><span>みんなで応援</span><small id="fanReactTotal"></small></div>
        <div class="reacts">${REACTIONS.map(e => `<button type="button" data-react="${e}">${e}<small>0</small></button>`).join("")}</div>
        <p class="fan-note">投票とリアクションは、このページを見ているみんなにリアルタイムで共有されます</p>`;
      el.addEventListener("click", ev => {
        const v = ev.target.closest("button[data-vote]");
        if (v && !v.disabled) return vote(v.dataset.vote);
        const r = ev.target.closest("button[data-react]");
        if (r) react(r.dataset.react);
      });
      fan.el = el;
      return el;
    }

    function updateFanView() {
      if (!fan.el || !fan.game) return;
      let k = 0, o = 0;
      for (const v of fan.votes.values()) v === "kings" ? k++ : o++;
      const total = k + o;
      const pk = total ? Math.round(k / total * 100) : 50;
      const mine = myVote(fan.game);
      const closed = fan.closed;
      const bk = fan.el.querySelector('[data-vote="kings"]');
      const bo = fan.el.querySelector('[data-vote="opp"]');
      bk.textContent = `キングス ${pk}%`;
      bo.textContent = `${fan.opp || "相手"} ${100 - pk}%`;
      bk.classList.toggle("mine", mine === "kings");
      bo.classList.toggle("mine", mine === "opp");
      bk.disabled = bo.disabled = !!mine || closed;
      fan.el.querySelector("#fanVotes").textContent = `${total}票${closed ? "（締め切り）" : mine ? "（投票済み）" : ""}`;
      let sum = 0;
      fan.el.querySelectorAll("button[data-react]").forEach(b => {
        const n = fan.reacts[b.dataset.react] || 0;
        sum += n;
        b.querySelector("small").textContent = n > 999 ? (n / 1000).toFixed(1) + "K" : n;
      });
      fan.el.querySelector("#fanReactTotal").textContent = `${sum.toLocaleString()} 回`;
    }

    // 描き直したカードの置き場所(#fanSlot)に、いつもの1つの要素を差し込む(数やアニメーションが消えないように)
    function placeFan(target) {
      if (!target) {
        if (fan.source) { fan.source.close(); fan.source = null; }
        fan.game = null;
        return;
      }
      if (fan.game !== target.game) {
        fan.game = target.game;
        fan.votes = new Map();
        fan.reacts = {};
        fan.seen = new Set();
        if (fan.source) fan.source.close();
        fan.source = "EventSource" in window ? new EventSource(`${NTFY}/${FAN_TOPIC}/sse`) : null;
        if (fan.source) fan.source.onmessage = e => { try { acceptFan(JSON.parse(e.data), true); } catch {} };
        fetch(`${NTFY}/${FAN_TOPIC}/json?poll=1&since=8h`, { cache: "no-store" })
          .then(r => r.ok ? r.text() : "")
          .then(t => t.split("\n").forEach(line => { if (line.trim()) { try { acceptFan(JSON.parse(line)); } catch {} } }))
          .catch(() => {});
      }
      fan.opp = target.opp;
      fan.closed = target.closed;
      const slot = document.getElementById("fanSlot");
      if (slot) slot.replaceWith(fanElement());
      updateFanView();
    }

    // ---------------------------------------------------------------- 画面
    function render() {
      const now = Date.now();
      const state = liveState(now);
      let list = upcoming(now);
      // 速報を出している試合は「次の試合」から外す
      if (state) list = list.filter(g => new Date(g.datetime).getTime() !== new Date(live.datetime).getTime());

      const liveHtml = state ? liveCard(state) : "";
      clearInterval(timer);

      if (list.length === 0) {
        app.innerHTML = liveHtml + (state ? "" : '<div class="card"><p class="message">登録されている次の試合はありません。</p></div>');
        placeFan(fanTarget(state, null));
        timer = setInterval(() => { if (liveState(Date.now()) !== state) render(); }, 30000);
        return;
      }

      const [next, ...rest] = list;
      const started = next.start.getTime() <= now;

      app.innerHTML = liveHtml + `
        ${state ? '<h2 class="section">次の試合</h2>' : ""}
        <div class="card">
          <div class="top">
            <span class="badge ${next.home ? "home" : "away"}">${next.home ? "HOME" : "AWAY"}</span>
            ${started ? '<span class="live">● 試合中</span>' : ""}
          </div>
          <p class="vs">VS</p>
          <p class="opponent">${esc(next.opponent)}</p>
          <dl>
            <dt>日付</dt><dd>${fmtDate.format(next.start)}</dd>
            <dt>時間</dt><dd>${fmtTime.format(next.start)} 試合開始</dd>
            <dt>会場</dt><dd>${esc(next.venue || "未定")}</dd>
          </dl>
          ${milestoneHtml()}
          ${!state && fanTarget(null, next) ? '<div id="fanSlot"></div>' : ""}
          ${next.ticket || next.live ? `
            <div class="actions">
              ${next.ticket ? `<a class="ticket" href="${esc(next.ticket)}" target="_blank" rel="noopener">チケットを買う</a>` : ""}
              ${next.live ? `<a class="watch" href="${esc(next.live)}" target="_blank" rel="noopener">ライブ配信を見る</a>` : ""}
            </div>` : ""}
          ${next.url ? `<a class="official" href="${esc(next.url)}" target="_blank" rel="noopener">B.LEAGUE 公式の試合ページ ›</a>` : ""}
          <div class="countdown">
            <div class="label">${started ? "試合開始から" : "試合開始まで"}</div>
            <div class="units">
              <div class="unit"><span class="num" id="d">-</span><small>日</small></div>
              <div class="unit"><span class="num" id="h">-</span><small>時間</small></div>
              <div class="unit"><span class="num" id="m">-</span><small>分</small></div>
              <div class="unit"><span class="num" id="s">-</span><small>秒</small></div>
            </div>
          </div>
        </div>
        ${rest.length ? `
          <h2 class="section">その後の予定</h2>
          <ul class="later">
            ${rest.map(g => `
              <li>
                <span>${fmtShort.format(g.start)} ${fmtTime.format(g.start)}　vs ${esc(g.opponent)}</span>
                <span class="ha">${g.home ? "HOME" : "AWAY"}</span>
              </li>`).join("")}
          </ul>` : ""}
      `;

      const tick = () => {
        const t = Date.now();
        // 試合が終わる時刻を過ぎた・試合が始まった・速報の表示が変わったら描き直す
        if (t >= next.start.getTime() + GAME_LENGTH_MS) return render();
        if (!started && t >= next.start.getTime()) return render();
        if (liveState(t) !== state) return render();
        if (!state && !!fanTarget(null, next) !== hadFan) return render();   // 開始3時間前になったら投票欄を出す

        const diff = Math.abs(next.start.getTime() - t);
        const sec = Math.floor(diff / 1000);
        document.getElementById("d").textContent = Math.floor(sec / 86400);
        document.getElementById("h").textContent = String(Math.floor(sec / 3600) % 24).padStart(2, "0");
        document.getElementById("m").textContent = String(Math.floor(sec / 60) % 60).padStart(2, "0");
        document.getElementById("s").textContent = String(sec % 60).padStart(2, "0");
      };
      const hadFan = !state && !!fanTarget(null, next);
      placeFan(fanTarget(state, next));
      tick();
      timer = setInterval(tick, 1000);
    }

    // webcal:// で開くと、カレンダーアプリが「照会(購読)」として登録し、あとから自動で更新される。
    // Google カレンダーは ?cid= に同じアドレスを渡すと「カレンダーを追加」の画面が開く
    const calUrl = "webcal://" + location.host + location.pathname.replace(/[^/]*$/, "") + "calendar.ics";
    document.getElementById("calApple").href = calUrl;
    document.getElementById("calGoogle").href = "https://calendar.google.com/calendar/render?cid=" + encodeURIComponent(calUrl);

    fetch("standings.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        for (const row of (data && data.rows) || []) if (row.team && row.short) shortNames[row.team] = row.short;
        if (games.length) render();
      })
      .catch(() => {});

    fetch("players.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        roster = data && Array.isArray(data.players) ? data.players : [];
        renderBirthday();
        if (games.length) render();
      })
      .catch(() => {});

    fetch("schedule.json", { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        if (data.note) document.getElementById("note").textContent = data.note;
        games = Array.isArray(data.games) ? data.games : [];
        render();
        pollLive();   // 直近の試合結果があれば表示する
        updateConnection();
        setInterval(updateConnection, 60000);
      })
      .catch(() => {
        app.innerHTML = '<div class="card"><p class="message">schedule.json を読み込めませんでした。</p></div>';
      });
  </script>
</body>
</html>
